name: Solar-unit-test

on: 
    workflow_dispatch: 
    push: 
        branches: ['main', 'feat/*']

env:
  MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
  MONGO_USERNAME: ${{vars.mongouser}}
  MONGO_PASSWORD: ${{secrets.mongopassword}}
jobs:
    unit-test:
        strategy:
          matrix:
            nodejs-version: [18,19,20]
            os: [ubuntu-latest,windows-latest]
            exclude:
              - os: windows-latest
                nodejs-version: 19
          

        runs-on: ${{matrix.os}}
        steps:
            - name: checkout
              uses: actions/checkout@v4

            - name: node-setup for ${{matrix.nodejs-version}}
              uses: actions/setup-node@v4
              with:
                node-version: ${{matrix.nodejs-version}}

            - name: install 
              run: npm install
              
            - name: Test
              run: npm test

            - name: upload artifacts
              uses: actions/upload-artifact@v4
              with:
                name: test-result
                path: test-results.xml
