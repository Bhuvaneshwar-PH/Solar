apiVersion: v1
kind: Service
metadata:
  labels:
    app: {{ .Values.label.name }}
  name: {{ .Values.service.name }}
  namespace: {{ .Values.namespace }}
spec:
  ports:
  - port: {{ .Values.service.port }}
    targetPort: {{ .Values.deploy.port }}
  selector:
    app: {{ .Values.label.name }}
  type: {{ .Values.service.type }}