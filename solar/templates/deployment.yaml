apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.deploy.name }}
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.deploy.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.label.name }}
  strategy: {}
  template:
    metadata:
      labels:
        app: {{ .Values.label.name }}
    spec:
      containers:
      - image: "{{ .Values.deploy.image }}:{{ .Values.deploy.tag }}"
        name: {{ .Values.deploy.name }}
        ports:
        - containerPort: {{ .Values.deploy.port }}

        